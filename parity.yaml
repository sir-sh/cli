coverage_xml: .parity/per-test

test:
  command: "XDEBUG_MODE=coverage vendor/bin/pest {test_abs} --coverage-clover={coverage} --colors=never"
  coverage: ".parity/tmp/{slug}.xml"
  reports: ".parity/per-test"

structure:
  - name: Sir commands
    paths:
      source: app/Commands
      test: tests
    file_map:
      AgentCommand.php: Unit/Commands/AgentCommandTest.php
      InspireCommand.php: Feature/InspireCommandTest.php
      McpServeCommand.php: Feature/McpServeTest.php
      PlanCommand.php: Unit/Commands/AgentCommandTest.php
      RecipesInstallCommand.php: Unit/Commands/CliCommandsSurfaceTest.php
      RecipesListCommand.php: Unit/Commands/CliCommandsSurfaceTest.php
      RecipesRemoveCommand.php: Unit/Commands/CliCommandsSurfaceTest.php
      RecipesUpdateCommand.php: Unit/Commands/CliCommandsSurfaceTest.php
      RunWorkflowCommand.php: Unit/Commands/AgentCommandTest.php
      WhereCommand.php: Unit/LayerResolverTest.php
      WorkflowsListCommand.php: Unit/Commands/CliCommandsSurfaceTest.php
      WorkflowsShowCommand.php: Unit/Commands/CliCommandsSurfaceTest.php
    rules: []

  - name: Sir services
    paths:
      source: app/Services
      test: tests
    file_map:
      Approvals/PendingRuns.php: Unit/AskSirTest.php
      ConditionEvaluator.php: Unit/ConditionEvaluatorTest.php
      ConfigLoader.php: Unit/ConfigLoaderTest.php
      Context.php: Unit/ContextTest.php
      Dashboard/AskSir.php: Unit/AskSirTest.php
      Dashboard/ProjectWorkflowFiles.php: Unit/WorkflowDraftTest.php
      Dashboard/VoiceSession.php: Unit/VoiceSessionTest.php
      Dashboard/WorkflowDraft.php: Unit/WorkflowDraftTest.php
      DashboardRegistry.php: Unit/DashboardRegistryTest.php
      LayerResolver.php: Unit/LayerResolverTest.php
      Mcp/WorkflowServer.php: Feature/McpServeTest.php
      Methods/MethodExecutor.php: Unit/MethodExecutorTest.php
      Methods/MethodRegistry.php: Unit/Methods/MethodSystemTest.php
      Packs/PackManager.php: Unit/Packs/PackManagerTest.php
      Tasks/BuiltIn/CodeRabbitReviewTask.php: Unit/Tasks/BuiltInTasksTest.php
      Tasks/BuiltIn/TestsAutoTask.php: Unit/Tasks/BuiltInTasksTest.php
      Tasks/BuiltIn/WorkspaceTempTask.php: Unit/Tasks/BuiltInTasksTest.php
      Tasks/Files/FilesWriteMdTask.php: Unit/Tasks/BuiltInTasksTest.php
      Tasks/Files/FilesWriteTask.php: Unit/Tasks/BuiltInTasksTest.php
      Tasks/Git/GitCloneTask.php: Unit/Tasks/BuiltInTasksTest.php
      Tasks/TaskRegistry.php: Unit/Tasks/BuiltInTasksTest.php
      Workflows/LoopExecutor.php: Unit/LoopLogicTest.php
      Workflows/WorkflowInspection.php: Unit/AskSirTest.php
      Workflows/WorkflowLoader.php: Unit/WorkflowTest.php
      Workflows/WorkflowRunner.php: Unit/WorkflowTest.php
    rules: []
