name: Tests

on: ['push', 'pull_request']

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.3', '8.4']
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: fileinfo
        coverage: pcov

    - name: Setup Node for task integration tests
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Problem Matches
      run: |
        echo "::add-matcher::${{ runner.tool_cache }}/php.json"
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Install Composer dependencies
      run: composer update --${{ matrix.dependency-version }} --no-interaction --prefer-dist --ansi

    - name: Style Testing
      run: vendor/bin/pint --test --ansi

    - name: Unit Testing
      run: vendor/bin/pest

    - name: Local workflow smoke test
      if: runner.os != 'Windows'
      run: |
        mkdir -p "$RUNNER_TEMP/sir-bin"
        ln -s "$PWD/application" "$RUNNER_TEMP/sir-bin/sir"
        sh tests/smoke-local.sh "$RUNNER_TEMP/sir-bin/sir"
